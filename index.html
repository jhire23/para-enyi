<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Enyiel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap');
    :root {
      --bg-color: #050505;
      --card-bg: rgba(20, 20, 25, 0.85);
      --text-color: #ffffff;
      --accent-pink: #ec4899;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 50% 10%, rgba(236, 72, 153, 0.08) 0px, transparent 60%),
        radial-gradient(at 50% 90%, rgba(168, 85, 247, 0.08) 0px, transparent 60%);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #f472b6, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .header p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 16px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    .btn-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-icon {
      font-size: 1.4rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }
    .arrow {
      color: #475569;
      font-size: 1.1rem;
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .link-btn:hover .arrow {
      transform: translateX(4px);
      color: var(--text-color);
    }
    .link-btn.rosa:hover { background: rgba(236, 72, 153, 0.12); border-color: var(--accent-pink); }
    .link-btn.morado:hover { background: rgba(168, 85, 247, 0.12); border-color: var(--accent-purple); }
    .link-btn.miel:hover { background: rgba(245, 158, 11, 0.12); border-color: var(--accent-amber); }
    .link-btn.celeste:hover { background: rgba(59, 130, 246, 0.12); border-color: var(--accent-blue); }
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Para Enyiel</h1>
      <p>Presiona un boton para ir a la pagina</p>
    </div>
    <div class="links-grid">
      
      <!-- Una carta -->
      <a href="https://jhire23.github.io/para-enyi/carta" class="link-btn rosa">
        <div class="btn-content">
          <div class="btn-icon">✉️</div>
          <span>Una carta</span>
        </div>
        <span class="arrow">➜</span>
      </a>

      <!-- Frasco -->
      <a href="https://jhire23.github.io/para-enyi/frasco" class="link-btn miel">
        <div class="btn-content">
          <div class="btn-icon">🫙</div>
          <span>Frasco</span>
        </div>
        <span class="arrow">➜</span>
      </a>

      <!-- Consultorio -->
      <a href="https://jhire23.github.io/para-enyi/consultorio" class="link-btn celeste">
        <div class="btn-content">
          <div class="btn-icon">🩺</div>
          <span>Consultorio</span>
        </div>
        <span class="arrow">➜</span>
      </a>
    </div>
    <div class="footer">
      Con cariño, Jhire ❤️
    </div>
  </div>
</body>
</html>
